name: Create Release

on:
  push:
    branches:
      - production

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows EXE
        run: |
          python -m PyInstaller --clean --onefile --noconsole --name "DiscordMusicBot" bot_systray.py

      - name: Prepare Dockge.zip
        run: |
          Compress-Archive -Path Dockge\* -DestinationPath Dockge.zip

      - name: Get version
        id: get_version
        run: |
          $version = "v$(Get-Date -Format 'yyyy.MM.dd.HHmm')"
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Create Draft Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          draft: true
          files: |
            dist/DiscordMusicBot.exe
            Dockge.zip
          body: |
            ## Discord Music Bot Release

            ### What's New:
            <!-- Add new features and changes here -->
            -

            ### Downloads:
            - **Windows .exe**: System tray version with GUI setup
            - **Dockge.zip**: Docker deployment package

            ### Installation:

            #### Windows (.exe):
            1. Download `DiscordMusicBot.exe`
            2. Run it - it will run in your system tray (look for a red square 🟥)
            3. On first run, you'll be prompted to enter your Discord bot token
            4. Right-click the red square icon to access stats or quit

            #### Dockge (Docker):
            1. Download `Dockge.zip`
            2. Extract and drag into Dockge
            3. Edit `.env` with your Discord token
            4. Start the stack

            ### Features:
            For a complete list of features and commands, see the [Features section](https://github.com/Virtual065/MusicBot?tab=readme-ov-file#-features) in the README.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
